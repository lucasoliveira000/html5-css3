    <title>tags em html</title>

     <h1>Tags em html</h1>
        <p>Em html podemos inserir os elementos da lista a seguir.<br>brpasse o muose sobre os termos para descobrir qual <br>tag devera utilizar em cada caso</p>
        <ul type="square">
            <li><abbr title="use a tag <p>">paragrafos</abbr></li>
            <li><abbr title="use a tag <h1>">titulos</abbr></li>
            <li><abbr title="use a tag <img>">imagens</abbr></li>

            <li><abbr title="use a tag <pre>">códigos-fonte</abbr></li>
            <li><abbr title="use a tag <ol>">listas numeradas</abbr></li>

        </ul>
