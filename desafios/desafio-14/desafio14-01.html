<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            
        }

        table{
            border-collapse: collapse;
        }

        .titulos{
            background-color: rgb(78, 78, 78);
            color: white;
        }

        .medias{
            text-align: left;
        }

        tr,th,td{
            padding: 8px;
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr class="titulos">
                <th rowspan="2" scope="col">AREA</th>
                <th rowspan="2" scope="col">DICIPLINAS</th>
                <th colspan="2" scope="colgroup">NOTAS</th>
                <th rowspan="2" scope="col">MEDIA</th>
            </tr> 

            <tr class="titulos">
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
                
            </tr>

        </thead>

        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">EXATAS</th>
                <td>Matematica</td>
                <td>0 0</td> 
                <td>0 0</td>
                <td>0 0</td>
            </tr>

            <tr>
                <td>Fisica</td>
                <td>0 0</td>
                <td>0 0</td>
                <td>0 0</td>
            </tr>

            <tr>
                <td>Quimica</td>
                <td>0 0</td>
                <td>0 0</td>
                <td>0 0</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td>0 0</td>
                <td>0 0</td>
                <td>0 0</td>
            </tr>

            <tr class="titulos">
                <th colspan="4" class="medias" scope="colgroup">MEDIA DE EXATAS</th>
                <td>0 0</td>
            </tr>

            <tr>
                <th rowspan="2" scope="rowgroup">HUMANAS</th>
                <td>Historia</td>
                <td>0 0</td>
                <td>0 0</td>
                <td>0 0</td>
            </tr>

            <tr>
                <td>GEOGRAFIA</td>
                <td>0 0</td>
                <td>0 0</td>
                <td>0 0</td>
            </tr>

            <tr class="titulos">
                <th colspan="4" class="medias" scope="row">MEDIA DE HUMANAS</th>
                <td>0 0</td>
            </tr>






        </tbody>

        <tfoot>



        </tfoot>

    </table>
</body>
</html>
