<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        label{
            position: relative;
            display:inline-block ;
            width: 120px;
            height: 80px;
            
        }

        label > input{
            opacity: 0;
            
        } 

        span{
            position: absolute;
            inset: 0;
            background-color: gray;
            cursor: pointer;
            border-radius: 20px;


        }
        
        span::before{
            background-color: rgb(255, 255, 255);
            position: absolute;
            content:"";
            width: 50px;
            height: 50px;
            border-radius: 30px;
            left: 4px;
            bottom: 15px;
            transition: 3.s;
        }

        input:checked + span{
            background-color: rgb(50, 165, 42);
        }

        input:checked + span::before{
            transform: translateX(60px);
        }


    </style>
</head>
<body>
    <h1>Criando botao</h1>
    <label>
        <input type="checkbox">
        <span></span>
    </label>

    <label>
        <input type="checkbox">
        <span></span>
    </label>

    <label>
        <input type="checkbox">
        <span></span>
    </label>

    <label>
        <input type="checkbox">
        <span></span>
    </label>

    <label>
        <input type="checkbox">
        <span></span>
    </label>
</body>
</html>
