<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>botoes</title>
    <style>
        label{
            position: relative;
            display: inline-block;
            width: 200px;
            height: 120px;
            border-radius: 60px;
        }

        input{
            opacity: 0;
            
        }

        span{
            position: absolute;
            background-color: rgb(244, 224, 200);
            inset: 0;
            cursor: pointer;
            border-radius: 40px;
        }

        span::before{
            position: absolute;
            background-color: rgb(247, 244, 244);
            content: "";
            width: 80px;
            height: 80px;
            border-radius: 40px;
            left: 10px;
            bottom: 20px;
            box-shadow: 1px 1px 10px;
        }

        input:checked + span{
            background-color: rgb(0, 255, 60);
        }

        

        input:checked + span::before{
            transform: translate(80px);
            
        }
    </style>
</head>
<body>
    <h1>Criando botão liga e desliga</h1>
    <label>
        <input type="checkbox">
        <span></span>
    </label>
</body>
</html>
