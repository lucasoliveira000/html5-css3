<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
     <h1>INSERINDO VIDEOS HOSPEDADOS LOCALMENTE</h1>
     <p>este video esta hospedado no meu proprio servidor</p>
     <video width="350" poster="imagens/capa do video.jpg" controls loop> 
        <source src="midia/meu-video.mp4.mp4" type="video/mp4">
        <source src="midia/Meu-Video.M4v.m4v" type="video/mp4">
        <source src="midia/Meu -Video.webm.webm" type="video/webm">
        <source src="midia/meu-video.ogv_1.ogv" type="video/ogg">
        <p> seu navegador não tem compatibilidade com reprodução de videos</p>
     </video>
     <h1>INSERINDO VIDEOS DO YOUTUBE</h1>
     <iframe width="350" height="315" src="https://www.youtube.com/embed/ImowkpTfAw4?si=tnK7B72XcTbkMFHi" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
     
     <h1>INSERINDO VIDEOS DO VIMEO</h1>

     <div style="padding:100% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/729411819?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:60%;height:60%;" title="Animação ame o processo"></iframe></div><script src="https://player.vimeo.com/api/player.js"></script>
    
</body>
</html>
