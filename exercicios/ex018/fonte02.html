<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family:'circus';
            src: url(fontes/Carnevalee\ Freakshow.ttf) format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family:'harry';
            src: url('fontes/HARRYP__.TTF') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family:'love';
            src: url('fontes/Love\ Boho.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        body{
            font-family:'circus',Arial, Helvetica, sans-serif;
            font-weight: normal;
            font-style: normal;
        }
        h1{
            font-family:'harry','love', Times, serif;
            font-size: 4em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quia nihil odit esse maiores fugiat veritatis! Modi dolor reprehenderit tempore? Ducimus ea maiores officia aspernatur dignissimos itaque maxime est accusantium libero?</p>
    
</body>
</html>
