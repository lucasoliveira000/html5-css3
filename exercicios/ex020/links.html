<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            
        }
        a{
            color: brown;
            text-decoration: none;
            font-weight: bolder;
        }
        a:visited{
            color: rgb(77, 1, 1);
        }
        a:hover{
            text-decoration: underline;
            font-size: 17px;
           
        }
        a:active{
            color: rgb(246, 255, 0);
        }
        a::before{
            content:'»';
            text-decoration:none ;
            font-weight: normal;
            color: rgb(0, 0, 0);
        }
        a::after{
            content:'«';
            text-decoration:none ;
            font-weight: normal;
            color: rgb(0, 0, 0);

        }

    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io">Repositorio Github</a></li>
        <li><a href="https:youtube.com/cursoemvideo/">Canal do YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com">Site do cursoemvideo</a></li>

    </ul>
</body>
</html>
